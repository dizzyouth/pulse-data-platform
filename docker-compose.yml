x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: pulse-airflow:2.11.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-pulse-local-development-only}
    PYTHONPATH: /opt/pulse
    SPARK_MASTER: local[2]
    BRONZE_MARKETPLACE_VALID_PATH: /opt/pulse/data/bronze/marketplace_events/valid
    SILVER_MARKETPLACE_VALID_PATH: /opt/pulse/data/silver/marketplace_events/valid
    SILVER_MARKETPLACE_REJECTED_PATH: /opt/pulse/data/silver/marketplace_events/rejected
    SILVER_MARKETPLACE_VALID_CHECKPOINT_PATH: /opt/pulse/data/checkpoints/silver/marketplace_events/valid
    SILVER_MARKETPLACE_REJECTED_CHECKPOINT_PATH: /opt/pulse/data/checkpoints/silver/marketplace_events/rejected
    SILVER_EVENT_WATERMARK: ${SILVER_EVENT_WATERMARK:-7 days}
    SILVER_SHUFFLE_PARTITIONS: ${SILVER_SHUFFLE_PARTITIONS:-4}
    GOLD_DAILY_SALES_PATH: /opt/pulse/data/gold/daily_sales
    GOLD_CUSTOMER_METRICS_PATH: /opt/pulse/data/gold/customer_metrics
    GOLD_PRODUCT_METRICS_PATH: /opt/pulse/data/gold/product_metrics
    GOLD_FUNNEL_METRICS_PATH: /opt/pulse/data/gold/funnel_metrics
    GOLD_SHUFFLE_PARTITIONS: ${GOLD_SHUFFLE_PARTITIONS:-4}
    WAREHOUSE_DB: ${WAREHOUSE_DB:-pulse_analytics}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-pulse}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-pulse-local-development-only}
    WAREHOUSE_HOST: warehouse-postgres
    WAREHOUSE_PORT: 5432
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/pulse/src:ro
    - ./data:/opt/pulse/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy
    warehouse-postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: pulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic marketplace.events \
          --partitions 3 \
          --replication-factor 1

        current_partitions=$$(
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --describe \
            --topic marketplace.events \
          | sed -n 's/.*PartitionCount: \([0-9][0-9]*\).*/\1/p'
        )

        if [ "$$current_partitions" -lt 3 ]; then
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --alter \
            --topic marketplace.events \
            --partitions 3
        elif [ "$$current_partitions" -gt 3 ]; then
          echo "marketplace.events already has $$current_partitions partitions; Kafka cannot reduce it to 3" >&2
          exit 1
        fi

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --describe \
          --topic marketplace.events
    restart: "no"

  airflow-postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  warehouse-postgres:
    image: postgres:16.4-alpine
    container_name: pulse-warehouse-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-pulse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-pulse-local-development-only}
      POSTGRES_DB: ${WAREHOUSE_DB:-pulse_analytics}
    volumes:
      - warehouse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-pulse} -d ${WAREHOUSE_DB:-pulse_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users list | grep -Fq "$${AIRFLOW_ADMIN_USERNAME}" || \
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Pulse \
            --lastname Admin \
            --role Admin \
            --email pulse@example.local
    environment:
      <<: *airflow-common-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-data:
  airflow-postgres-data:
  warehouse-postgres-data:
  airflow-logs:
