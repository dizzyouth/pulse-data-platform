version: 2

models:
  - name: revenue_by_day
    description: "Daily recognized-revenue presentation by business and currency; neither businesses nor currencies are mixed."
    data_tests:
      - unique_combination:
          column_names: [business_id, event_date, currency]
    columns:
      - name: business_id
        description: "Stable business registry identifier."
        data_tests: [not_null]
      - name: event_date
        description: "Business reporting date for Shopify and UTC date for legacy marketplace events."
        data_tests: [not_null]
      - name: currency
        description: "ISO currency dimension retained to prevent invalid cross-currency sums."
        data_tests: [not_null]
      - name: gross_revenue
        description: "Recognized revenue in source currency; Shopify refunds and cancellations are reflected."
        data_tests: [not_null, nonnegative]
  - name: top_customers
    description: "Customer commerce metrics ranked independently inside each business."
    data_tests:
      - unique_combination:
          column_names: [business_id, customer_id]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: customer_id
        description: "Stable customer identifier."
        data_tests: [not_null]
      - name: revenue_rank
        description: "Rank by total gross revenue descending; ties share a rank."
        data_tests: [not_null]
  - name: top_products
    description: "Product commerce metrics ranked independently inside each business."
    data_tests:
      - unique_combination:
          column_names: [business_id, product_id]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: product_id
        description: "Stable product identifier."
        data_tests: [not_null]
      - name: revenue_rank
        description: "Rank by gross revenue descending; ties share a rank."
        data_tests: [not_null]
  - name: funnel_performance
    description: "Presentation of daily country funnel volumes and adjacent-stage event conversion rates."
    data_tests:
      - unique_combination:
          column_names: [business_id, event_date, country]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: event_date
        description: "UTC funnel date."
        data_tests: [not_null]
      - name: country
        description: "Marketplace country dimension."
        data_tests: [not_null]
      - name: view_to_cart_rate
        description: "Cart adds divided by views; null for a zero denominator."
        data_tests: [between_zero_and_one]
      - name: cart_to_checkout_rate
        description: "Checkout starts divided by cart adds; null for a zero denominator."
        data_tests: [between_zero_and_one]
      - name: checkout_to_order_rate
        description: "Orders created divided by checkout starts; null for a zero denominator."
        data_tests: [between_zero_and_one]
      - name: order_to_payment_rate
        description: "Payments completed divided by orders created; null for a zero denominator."
        data_tests: [between_zero_and_one]
  - name: marketing_overview
    description: "Cross-account marketing overview that never combines businesses or currencies and keeps platforms explicit."
    data_tests:
      - unique_combination:
          column_names: [business_id, platform, report_date, reporting_timezone, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: platform
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null, nonnegative]
      - name: impressions
        data_tests: [not_null, nonnegative]
      - name: clicks
        data_tests: [not_null, nonnegative]
      - name: ctr
        data_tests: [between_zero_and_one]
  - name: campaign_performance
    description: "Campaign-daily provider metrics and spend ranking, with platform attribution semantics retained."
    data_tests:
      - unique_combination:
          column_names: [business_id, source_type, source_id, platform, account_id, campaign_id, report_date, reporting_timezone, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: platform
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null, nonnegative]
      - name: spend_rank
        data_tests: [not_null]
  - name: ad_performance
    description: "Ad-daily provider metrics and spend ranking; provider creative IDs remain optional."
    data_tests:
      - unique_combination:
          column_names: [business_id, source_type, source_id, platform, account_id, campaign_id, ad_group_id, ad_id, report_date, reporting_timezone, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: platform
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null, nonnegative]
      - name: spend_rank
        data_tests: [not_null]
  - name: ad_group_performance
    description: "Canonical ad-group daily metrics and spend ranking, including Meta ad sets after terminology normalization."
    data_tests:
      - unique_combination:
          column_names: [business_id, source_type, source_id, platform, account_id, campaign_id, ad_group_id, report_date, reporting_timezone, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: platform
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null, nonnegative]
      - name: spend_rank
        data_tests: [not_null]
  - name: operations_overview
    description: "Current operational order counts and distinct order-value/COD collection measures."
    data_tests:
      - unique_combination:
          column_names: [business_id, currency, payment_type, current_operational_status]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: order_count
        data_tests: [not_null, nonnegative]
  - name: confirmation_operations
    description: "Confirmation-eligible cohort outcomes with explicit confirmed/eligible denominator."
    data_tests:
      - unique_combination:
          column_names: [business_id, cohort_date, provider, currency, payment_type]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: confirmation_rate
        data_tests: [between_zero_and_one]
  - name: operations_daily
    description: "Event-date operational volumes in explicit business reporting timezone and original currency."
    data_tests:
      - unique_combination:
          column_names: [business_id, event_date, reporting_timezone, currency, payment_type]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: delivered_orders
        data_tests: [not_null, nonnegative]
  - name: delivery_operations
    description: "Courier delivery presentation with shipped-order denominators preserved."
    data_tests:
      - unique_combination:
          column_names: [business_id, cohort_date, courier, currency, payment_type]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: delivery_rate
        data_tests: [between_zero_and_one]
  - name: cod_performance
    description: "COD expected and collected cash; never labeled revenue or profit."
    data_tests:
      - unique_combination:
          column_names: [business_id, collection_date, provider, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: cash_collected
        data_tests: [not_null, nonnegative]
  - name: remittance_operations
    description: "Settlement-period gross collection, fees, pending amount, and net remitted."
    data_tests:
      - unique_combination:
          column_names: [business_id, period_end, provider, currency, settlement_status]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: net_remitted
        data_tests: [not_null, nonnegative]
  - name: commerce_economics
    description: "Order-level contribution economics; never accounting or net profit."
    data_tests:
      - unique_combination:
          column_names: [business_id, order_source_id, order_id, currency]
      - contribution_formula
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: order_value
        data_tests: [not_null, nonnegative]
      - name: variable_operational_cost
        data_tests: [not_null, nonnegative]
  - name: unit_economics
    description: "Order-created cohort unit economics with null-safe denominators."
    data_tests:
      - unique_combination:
          column_names: [business_id, cohort_date, reporting_timezone, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: order_count
        data_tests: [not_null, nonnegative]
  - name: economics_daily
    description: "Event-date economic activity with distinct order, delivery, collection, settlement, cost, and marketing measures."
    data_tests:
      - unique_combination:
          column_names: [business_id, event_date, reporting_timezone, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: event_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: marketing_spend
        data_tests: [not_null, nonnegative]
  - name: campaign_economics
    description: "Explicitly attributed campaign outcomes, separate from platform-reported ROAS."
    data_tests:
      - unique_combination:
          column_names: [business_id, marketing_date, platform, marketing_source_id, campaign_id, marketing_currency, commerce_currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: marketing_currency
        data_tests: [not_null]
      - name: campaign_spend
        data_tests: [not_null, nonnegative]
  - name: cod_economics
    description: "COD contribution, cash collection, remittance gap, and unremitted delivery indicators."
    data_tests:
      - unique_combination:
          column_names: [business_id, order_source_id, order_id, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: remittance_gap
        data_tests: [not_null, nonnegative]
  - name: olist_orders_by_status
    description: "Olist native status distribution isolated to the benchmark business."
    data_tests:
      - unique_combination:
          column_names: [business_id, native_status]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: native_status
        data_tests: [not_null]
      - name: order_count
        data_tests: [not_null, nonnegative]
  - name: olist_commerce_daily
    description: "Fanout-safe Olist daily merchandise, customer freight, and payment measures."
    data_tests:
      - unique_combination:
          column_names: [business_id, event_date, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: orders
        data_tests: [not_null, nonnegative]
  - name: olist_payment_methods
    description: "Olist payment rows by native method; boleto is not COD."
    data_tests:
      - unique_combination:
          column_names: [business_id, payment_method, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: payment_amount
        data_tests: [not_null, nonnegative]
  - name: olist_data_quality
    description: "Classified Olist benchmark observations."
    data_tests:
      - unique_combination:
          column_names: [business_id, code]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: code
        data_tests: [not_null]
      - name: issue_count
        data_tests: [not_null, nonnegative]
  - name: olist_economic_completeness
    description: "Proof that unavailable COGS and attribution remain explicitly incomplete."
    data_tests:
      - unique_combination:
          column_names: [business_id, currency, economic_status]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: economic_status
        data_tests: [not_null]
  - name: uci_retail_daily
    description: "Daily UCI invoice and signed-ledger measures; net ledger value is not profit."
    data_tests:
      - unique_combination:
          column_names: [business_id, event_date, currency]
      - uci_daily_signed_reconciliation
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              values: [GBP]
      - name: invoice_count
        data_tests: [not_null, nonnegative]
      - name: anonymous_customer_rate
        data_tests: [between_zero_and_one]
  - name: uci_invoice_summary
    description: "One row per business and worksheet-scoped invoice, preserving native reversal semantics."
    data_tests:
      - unique_combination:
          column_names: [business_id, scoped_invoice_id]
      - uci_invoice_signed_reconciliation
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: scoped_invoice_id
        data_tests: [not_null]
      - name: raw_invoice_id
        data_tests: [not_null]
      - name: line_count
        data_tests: [not_null, nonnegative]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              values: [GBP]
  - name: uci_line_classification
    description: "Signed ledger values by explicit source-line classification."
    data_tests:
      - unique_combination:
          column_names: [business_id, line_classification, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: line_count
        data_tests: [not_null, nonnegative]
  - name: uci_country_distribution
    description: "Source-supplied country context only; no address inference."
    data_tests:
      - unique_combination:
          column_names: [business_id, country, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: line_count
        data_tests: [not_null, nonnegative]
      - name: invoice_count
        data_tests: [not_null, nonnegative]
  - name: uci_data_quality
    description: "Defects, completeness observations, and source/business semantics kept distinct."
    data_tests:
      - unique_combination:
          column_names: [business_id, code]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: issue_count
        data_tests: [not_null, nonnegative]
  - name: uci_economic_completeness
    description: "UCI economics limitations: no COGS, attribution, COD, remittance, or profit."
    data_tests:
      - unique_combination:
          column_names: [business_id, currency, economic_status]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              values: [GBP]
      - name: economic_status
        data_tests: [not_null]
  - name: sama_pilot_funnel
    description: "Lightfunnels-origin funnel with conservative identity resolution and matched-cohort lifecycle rates."
    data_tests:
      - unique_combination:
          column_names: [business_id]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: initial_orders
        data_tests: [not_null, nonnegative]
      - name: confirmation_rate
        data_tests: [between_zero_and_one]
      - name: delivery_rate
        data_tests: [between_zero_and_one]
      - name: return_rate
        data_tests: [between_zero_and_one]
  - name: sama_pilot_order_changes
    description: "Aggregate initial-versus-final quantity and value changes without customer-level records."
    data_tests:
      - unique_combination:
          column_names: [business_id, initial_quantity, final_quantity, currency]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: order_count
        data_tests: [not_null, nonnegative]
  - name: sama_pilot_native_economics
    description: "Native collected cash and COD fees alongside, but never netted against, USD rule-derived costs."
    data_tests:
      - unique_combination:
          column_names: [business_id, currency, economic_status]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: collected_native_currency
        data_tests: [not_null, nonnegative]
      - name: known_operational_cost_usd
        data_tests: [not_null, nonnegative]
      - name: economic_status
        data_tests:
          - not_null
          - accepted_values:
              values: [FX_REQUIRED, SEPARATE_CURRENCIES]
  - name: sama_pilot_data_quality
    description: "Aggregated pilot quality and business-outcome observations."
    data_tests:
      - unique_combination:
          column_names: [business_id, check_name]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: check_name
        data_tests: [not_null]
      - name: issue_count
        data_tests: [not_null, nonnegative]
  - name: sama_pilot_tiktok_native_performance
    description: "TikTok-native ad-day performance with provider diagnostics and ratios recalculated only from additive components."
    data_tests:
      - unique_combination:
          column_names: [business_id, account_id, campaign_id, ad_group_id, ad_id, report_date]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: spend_usd
        data_tests: [not_null, nonnegative]
      - name: destination_ctr
        data_tests: [between_zero_and_one]
  - name: sama_pilot_tiktok_campaign_outcomes
    description: "Campaign-only comparison of TikTok platform metrics and observed Lightfunnels/COD outcomes; no cross-currency revenue or business ROAS."
    data_tests:
      - unique_combination:
          column_names: [business_id, campaign_id]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: campaign_id
        data_tests: [not_null]
      - name: spend_currency
        data_tests:
          - not_null
          - accepted_values:
              values: [USD]
      - name: spend_usd
        data_tests: [not_null, nonnegative]
      - name: confirmation_rate
        data_tests: [between_zero_and_one]
      - name: delivery_rate
        data_tests: [between_zero_and_one]
      - name: return_rate
        data_tests: [between_zero_and_one]
  - name: sama_pilot_tiktok_data_quality
    description: "Phase 6.5B aggregate source, linkage, reconciliation, and boundary observations."
    data_tests:
      - unique_combination:
          column_names: [business_id, check_name]
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: check_name
        data_tests: [not_null]
      - name: issue_count
        data_tests: [not_null, nonnegative]
  - name: sama_pilot_unified_overview
    description: "One-row executive decision layer for the target TikTok-to-Lightfunnels acquisition cohort; native collections remain outside this USD-only aggregate."
    data_tests:
      - unique_combination:
          column_names: [business_id]
      - sama_unified_overview_reconciles
      - sama_unified_fact_cohort_reconciles
      - expression_is_true:
          expression: "delivered_orders <= shipped_orders"
      - expression_is_true:
          expression: "abs(known_operational_cost_usd - (product_cogs_usd + call_center_cost_usd + logistics_cost_usd)) <= 0.000001"
      - expression_is_true:
          expression: "abs(total_known_usd_cost - (marketing_spend_usd + known_operational_cost_usd)) <= 0.000001"
      - expression_is_true:
          expression: "period_start = date '2026-03-01' and period_end = date '2026-07-31'"
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: marketing_currency
        data_tests:
          - not_null
          - accepted_values:
              values: [USD]
      - name: reporting_timezone
        data_tests:
          - not_null
          - accepted_values:
              values: [Etc/GMT-1]
      - name: target_campaigns
        data_tests: [not_null, nonnegative]
      - name: marketing_spend_usd
        data_tests: [not_null, nonnegative]
      - name: impressions
        data_tests: [not_null, nonnegative]
      - name: destination_clicks
        data_tests: [not_null, nonnegative]
      - name: platform_conversions
        data_tests: [not_null, nonnegative]
      - name: checkouts
        data_tests: [not_null, nonnegative]
      - name: lightfunnels_orders
        data_tests: [not_null, nonnegative]
      - name: matched_orders
        data_tests: [not_null, nonnegative]
      - name: ambiguous_orders
        data_tests: [not_null, nonnegative]
      - name: unmatched_orders
        data_tests: [not_null, nonnegative]
      - name: confirmed_orders
        data_tests: [not_null, nonnegative]
      - name: shipped_orders
        data_tests: [not_null, nonnegative]
      - name: delivered_orders
        data_tests: [not_null, nonnegative]
      - name: returned_orders
        data_tests: [not_null, nonnegative]
      - name: out_of_stock_orders
        data_tests: [not_null, nonnegative]
      - name: confirmation_rate
        data_tests: [between_zero_and_one]
      - name: delivery_rate
        data_tests: [between_zero_and_one]
      - name: return_rate
        data_tests: [between_zero_and_one]
      - name: cost_per_lightfunnels_order_usd
        data_tests: [nonnegative]
      - name: cost_per_confirmed_order_usd
        data_tests: [nonnegative]
      - name: marketing_cost_per_delivered_order_usd
        data_tests: [nonnegative]
      - name: product_cogs_usd
        data_tests: [not_null, nonnegative]
      - name: call_center_cost_usd
        data_tests: [not_null, nonnegative]
      - name: logistics_cost_usd
        data_tests: [not_null, nonnegative]
      - name: known_operational_cost_usd
        data_tests: [not_null, nonnegative]
      - name: total_known_usd_cost
        data_tests: [not_null, nonnegative]
      - name: known_usd_cost_per_delivered_order
        data_tests: [nonnegative]
  - name: sama_pilot_unified_daily
    description: "Acquisition-date target-cohort trend; delivered and returned are final outcomes of each Lightfunnels intent cohort, not same-day operational events."
    data_tests:
      - unique_combination:
          column_names: [business_id, report_date]
      - sama_unified_daily_reconciles
      - expression_is_true:
          expression: "delivered_orders <= shipped_orders"
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: report_date
        data_tests:
          - not_null
          - date_between:
              start_date: "2026-03-01"
              end_date: "2026-07-31"
      - name: reporting_timezone
        data_tests:
          - not_null
          - accepted_values:
              values: [Etc/GMT-1]
      - name: spend_usd
        data_tests: [not_null, nonnegative]
      - name: impressions
        data_tests: [not_null, nonnegative]
      - name: destination_clicks
        data_tests: [not_null, nonnegative]
      - name: platform_conversions
        data_tests: [not_null, nonnegative]
      - name: checkouts
        data_tests: [not_null, nonnegative]
      - name: lightfunnels_orders
        data_tests: [not_null, nonnegative]
      - name: matched_orders
        data_tests: [not_null, nonnegative]
      - name: ambiguous_orders
        data_tests: [not_null, nonnegative]
      - name: unmatched_orders
        data_tests: [not_null, nonnegative]
      - name: confirmed_orders
        data_tests: [not_null, nonnegative]
      - name: shipped_orders
        data_tests: [not_null, nonnegative]
      - name: delivered_orders
        data_tests: [not_null, nonnegative]
      - name: returned_orders
        data_tests: [not_null, nonnegative]
      - name: out_of_stock_orders
        data_tests: [not_null, nonnegative]
      - name: confirmation_rate
        data_tests: [between_zero_and_one]
      - name: delivery_rate
        data_tests: [between_zero_and_one]
      - name: return_rate
        data_tests: [between_zero_and_one]
      - name: marketing_cost_per_order_usd
        data_tests: [nonnegative]
      - name: marketing_cost_per_confirmed_usd
        data_tests: [nonnegative]
      - name: marketing_cost_per_delivered_usd
        data_tests: [nonnegative]
  - name: sama_pilot_unified_native_economics
    description: "High-confidence target-TikTok COD collections by native currency and economic status, with USD costs alongside but never netted across currencies."
    data_tests:
      - unique_combination:
          column_names: [business_id, currency, economic_status]
      - sama_unified_native_reconciles
      - expression_is_true:
          expression: "abs(known_operational_cost_usd - (product_cogs_usd + call_center_cost_usd + logistics_cost_usd)) <= 0.000001"
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: currency
        description: "Authoritative native currency, or UNSPECIFIED when a non-delivered matched order has USD costs but no native commercial currency."
        data_tests:
          - not_null
          - accepted_values:
              values: [SAR, AED, KWD, UNSPECIFIED]
      - name: economic_status
        data_tests:
          - not_null
          - accepted_values:
              values: [FX_REQUIRED, SEPARATE_CURRENCIES]
      - name: delivered_orders
        data_tests: [not_null, nonnegative]
      - name: collected_native_currency
        data_tests: [not_null, nonnegative]
      - name: cod_fee_native_currency
        data_tests: [not_null, nonnegative]
      - name: cash_after_cod_fee_native_currency
        data_tests: [not_null, nonnegative]
      - name: product_cogs_usd
        data_tests: [not_null, nonnegative]
      - name: call_center_cost_usd
        data_tests: [not_null, nonnegative]
      - name: logistics_cost_usd
        data_tests: [not_null, nonnegative]
      - name: known_operational_cost_usd
        data_tests: [not_null, nonnegative]
  - name: sama_pilot_business_leakage
    description: "One row per explicitly named measurement, identity, confirmation, or fulfillment gap; differences are not automatically revenue loss."
    data_tests:
      - unique_combination:
          column_names: [business_id, leakage_stage]
      - sama_business_leakage_reconciles
      - expression_is_true:
          expression: "not (is_measurement_gap and is_operational_gap)"
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: leakage_stage
        data_tests:
          - not_null
          - accepted_values:
              values: [PLATFORM_VS_OBSERVED, IDENTITY_UNRESOLVED, MATCHED_NOT_CONFIRMED, CONFIRMED_NOT_SHIPPED, RETURNED_AFTER_SHIPMENT, SHIPPED_TERMINAL_UNRESOLVED]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              values: [MEASUREMENT, IDENTITY, CONFIRMATION, FULFILLMENT]
      - name: observed_count
        data_tests: [not_null, nonnegative]
      - name: denominator_count
        data_tests: [not_null, nonnegative]
      - name: observed_rate
        data_tests: [between_zero_and_one]
      - name: interpretation
        data_tests: [not_null]
  - name: sama_pilot_campaign_diagnostics
    description: "Target-campaign diagnostics against aggregate leave-one-out peer rates and costs; gaps are benchmark estimates, not causal impact or forecasts."
    data_tests:
      - unique_combination:
          column_names: [business_id, campaign_id]
      - sama_campaign_diagnostics_reconciles
      - expression_is_true:
          expression: "peer_matched_orders > 0 and peer_shipped_orders > 0 and peer_lightfunnels_orders > 0 and peer_delivered_orders > 0"
      - expression_is_true:
          expression: "confirmation_benchmark_gap_orders >= 0 and delivery_benchmark_gap_orders >= 0 and excess_returns_vs_peer >= 0"
    columns:
      - name: business_id
        data_tests: [not_null]
      - name: campaign_id
        data_tests: [not_null]
      - name: spend_usd
        data_tests: [not_null, nonnegative]
      - name: lightfunnels_orders
        data_tests: [not_null, nonnegative]
      - name: confirmation_rate
        data_tests: [between_zero_and_one]
      - name: delivery_rate
        data_tests: [between_zero_and_one]
      - name: return_rate
        data_tests: [between_zero_and_one]
      - name: peer_confirmation_rate
        data_tests: [between_zero_and_one]
      - name: peer_delivery_rate
        data_tests: [between_zero_and_one]
      - name: peer_return_rate
        data_tests: [between_zero_and_one]
      - name: cost_per_lightfunnels_order_usd
        data_tests: [nonnegative]
      - name: cost_per_confirmed_order_usd
        data_tests: [nonnegative]
      - name: cost_per_delivered_order_usd
        data_tests: [nonnegative]
      - name: peer_cost_per_lightfunnels_order_usd
        data_tests: [nonnegative]
      - name: peer_cost_per_delivered_order_usd
        data_tests: [nonnegative]
      - name: confirmation_sample_band
        data_tests:
          - accepted_values:
              values: [LOW, MEDIUM, HIGH]
      - name: fulfillment_sample_band
        data_tests:
          - accepted_values:
              values: [LOW, MEDIUM, HIGH]
      - name: acquisition_sample_band
        data_tests:
          - accepted_values:
              values: [LOW, MEDIUM, HIGH]
      - name: cost_delivered_sample_band
        data_tests:
          - accepted_values:
              values: [LOW, MEDIUM, HIGH]
  - name: sama_pilot_intelligence_signals
    description: "Deterministic explainable business and campaign signals with observational evidence, investigation guidance, and explicit causal limitations."
    data_tests:
      - unique_combination:
          column_names: [signal_id]
      - sama_intelligence_signals_valid
      - expression_is_true:
          expression: "not causal_claim"
      - expression_is_true:
          expression: "not (confidence = 'LOW' and priority = 'HIGH')"
    columns:
      - name: signal_id
        data_tests: [not_null, unique]
      - name: business_id
        data_tests: [not_null]
      - name: scope_type
        data_tests:
          - accepted_values:
              values: [BUSINESS, CAMPAIGN]
      - name: signal_category
        data_tests:
          - accepted_values:
              values: [MEASUREMENT, IDENTITY, ACQUISITION, CONFIRMATION, FULFILLMENT, ECONOMICS]
      - name: priority
        data_tests:
          - accepted_values:
              values: [HIGH, MEDIUM, LOW]
      - name: confidence
        data_tests:
          - accepted_values:
              values: [HIGH, MEDIUM, LOW]
      - name: sample_size
        data_tests: [not_null, nonnegative]
      - name: impact_order_count
        data_tests: [nonnegative]
      - name: evidence_summary
        data_tests: [not_null]
      - name: recommended_next_step
        data_tests: [not_null]
      - name: limitation
        data_tests: [not_null]
