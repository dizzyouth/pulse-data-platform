version: 2

sources:
  - name: analytics
    description: "Spark-produced Gold snapshots loaded transactionally into the dedicated Pulse analytics warehouse."
    schema: analytics
    tables:
      - name: daily_sales
        description: "Daily paid-order measures at business, reporting date, country, and currency grain; Shopify revenue is recognized net of refunds and cancellations."
        data_tests:
          - unique_combination:
              column_names: [business_id, event_date, country, currency]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: event_date
            description: "Business reporting date for Shopify and UTC event date for legacy marketplace events."
            data_tests: [not_null]
          - name: completed_orders
            description: "Count of distinct successfully paid orders."
            data_tests: [not_null, nonnegative]
          - name: units_sold
            description: "Units attached to completed payment events."
            data_tests: [not_null, nonnegative]
          - name: gross_revenue
            description: "Recognized revenue in source currency; Shopify refunds/cancellations are reflected and no FX conversion is applied."
            data_tests: [not_null, nonnegative]
      - name: customer_metrics
        description: "Lifetime-to-date event and paid-commerce measures at business/customer grain."
        data_tests:
          - unique_combination:
              column_names: [business_id, customer_id]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: customer_id
            description: "Stable marketplace customer identifier."
            data_tests: [not_null]
          - name: total_revenue
            description: "Customer recognized revenue in source currency; Shopify refunds/cancellations are reflected."
            data_tests: [not_null, nonnegative]
      - name: product_metrics
        description: "Lifetime-to-date activity and paid-commerce measures at business/product grain."
        data_tests:
          - unique_combination:
              column_names: [business_id, product_id]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: product_id
            description: "Stable marketplace product identifier."
            data_tests: [not_null]
          - name: gross_revenue
            description: "Product recognized revenue in source currency; Shopify refunds/cancellations are reflected."
            data_tests: [not_null, nonnegative]
      - name: funnel_metrics
        description: "Business-scoped daily country funnel stages and adjacent-stage conversion rates."
        data_tests:
          - unique_combination:
              column_names: [business_id, event_date, country]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: event_date
            description: "UTC calendar date of the funnel events."
            data_tests: [not_null]
          - name: view_to_cart_rate
            description: "Cart-add events divided by product-view events; null when views are zero."
            data_tests: [between_zero_and_one]
          - name: cart_to_checkout_rate
            description: "Checkout-start events divided by cart-add events; null when cart adds are zero."
            data_tests: [between_zero_and_one]
          - name: checkout_to_order_rate
            description: "Order-created events divided by checkout-start events; null when checkouts are zero."
            data_tests: [between_zero_and_one]
          - name: order_to_payment_rate
            description: "Payment-completed events divided by order-created events; null when orders are zero."
            data_tests: [between_zero_and_one]
      - name: marketing_daily
        description: "Provider-reported marketing facts by business, source, platform, account, reporting date, timezone, and currency. No FX conversion."
        data_tests:
          - unique_combination:
              column_names: [business_id, source_type, source_id, platform, account_id, report_date, reporting_timezone, currency]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: platform
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: spend
            data_tests: [not_null, nonnegative]
          - name: impressions
            data_tests: [not_null, nonnegative]
          - name: clicks
            data_tests: [not_null, nonnegative]
          - name: ctr
            data_tests: [between_zero_and_one]
      - name: campaign_performance
        description: "Provider-reported additive facts and safely derived KPIs at explicit campaign-daily grain."
        data_tests:
          - unique_combination:
              column_names: [business_id, source_type, source_id, platform, account_id, campaign_id, report_date, reporting_timezone, currency]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: platform
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: spend
            data_tests: [not_null, nonnegative]
      - name: ad_group_performance
        description: "Provider-neutral ad-group daily facts; Meta ad sets are mapped to ad_group_id/name."
        data_tests:
          - unique_combination:
              column_names: [business_id, source_type, source_id, platform, account_id, campaign_id, ad_group_id, report_date, reporting_timezone, currency]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: platform
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
      - name: ad_performance
        description: "Provider-reported ad daily facts with creative identity when supplied."
        data_tests:
          - unique_combination:
              column_names: [business_id, source_type, source_id, platform, account_id, campaign_id, ad_group_id, ad_id, report_date, reporting_timezone, currency]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: platform
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: spend
            data_tests: [not_null, nonnegative]
      - name: order_operations_current
        description: "Latest operational state derived from immutable event history; order value, cash collected, and remittance are separate measures."
        data_tests:
          - unique_combination:
              column_names: [business_id, order_id]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: current_operational_status
            data_tests:
              - accepted_values:
                  values: [CREATED, PENDING_CONFIRMATION, CONFIRMED, REJECTED_CONFIRMATION, CANCELLED, READY_FOR_FULFILLMENT, FULFILLED, SHIPPED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERY_ATTEMPTED, DELIVERED, REFUSED, UNREACHABLE, RESCHEDULED, RETURN_IN_TRANSIT, RETURNED_TO_ORIGIN, CASH_COLLECTED, REMITTANCE_PENDING, REMITTED]
      - name: order_operations_daily
        description: "Operational event-date facts in the business reporting timezone; not an order-created cohort view."
        data_tests:
          - unique_combination:
              column_names: [business_id, event_date, reporting_timezone, currency, payment_type]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: event_date
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: delivered_orders
            data_tests: [not_null, nonnegative]
      - name: confirmation_performance
        description: "Order-created cohort confirmation metrics; confirmation rate is confirmed divided by confirmation-eligible non-prepaid orders."
        data_tests:
          - unique_combination:
              column_names: [business_id, cohort_date, provider, currency, payment_type]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: provider
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: confirmation_rate
            data_tests: [between_zero_and_one]
      - name: delivery_performance
        description: "Order-created cohort delivery metrics by courier; delivery rate is delivered divided by shipped."
        data_tests:
          - unique_combination:
              column_names: [business_id, cohort_date, courier, currency, payment_type]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: courier
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: delivery_rate
            data_tests: [between_zero_and_one]
      - name: cod_collection_performance
        description: "COD cash expected and collected by collection event date, provider, and original currency."
        data_tests:
          - unique_combination:
              column_names: [business_id, collection_date, provider, currency]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: provider
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: cash_collected
            data_tests: [not_null, nonnegative]
      - name: remittance_performance
        description: "Provider settlement-period facts; net remitted is not revenue or profit."
        data_tests:
          - unique_combination:
              column_names: [business_id, period_end, provider, currency, settlement_status]
        columns:
          - name: business_id
            data_tests: [not_null]
          - name: provider
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: net_remitted
            data_tests: [not_null, nonnegative]
