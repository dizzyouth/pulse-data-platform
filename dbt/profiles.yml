pulse_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5433') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'pulse_analytics') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'pulse') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'marts') }}"
      threads: 2
      connect_timeout: 10
